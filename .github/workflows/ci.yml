name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: build both packages
        run: ./build.sh
      - name: lint the Firefox build
        run: npx --yes web-ext@10.7.0 lint --source-dir dist/firefox
      - name: permissions and CSP stay minimal
        run: python3 -I tools/check_manifests.py
