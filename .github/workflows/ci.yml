name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: build both packages
        run: ./build.sh
      # The Android warning is a false positive: the add-on is desktop only, so it
      # must not declare gecko_android, which would offer it on Firefox for Android.
      - name: lint the Firefox build
        run: |
          npx --yes web-ext@10.7.0 lint --output=json --source-dir dist/firefox > lint.json || true
          python3 -I -c "
          import json, sys
          r = json.load(open('lint.json'))
          bad = r['errors'] + [w for w in r['warnings'] if w['code'] != 'KEY_FIREFOX_ANDROID_UNSUPPORTED_BY_MIN_VERSION']
          for m in bad: print(m['code'], m['message'])
          sys.exit(1 if bad else 0)
          "
      - name: permissions and CSP stay minimal
        run: python3 -I tools/check_manifests.py
